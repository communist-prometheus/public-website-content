name: Trigger website deploy

on:
  push:
    branches: [master, develop]

# The only thing this workflow does is fire a repository_dispatch with a
# dedicated DEPLOY_TOKEN secret; the built-in GITHUB_TOKEN needs nothing.
permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: communist-prometheus/public-website
          event-type: content-updated
          client-payload: >-
            {
              "branch": "${{ github.ref_name }}",
              "author_name": ${{ toJSON(github.event.head_commit.author.name) }},
              "author_email": ${{ toJSON(github.event.head_commit.author.email) }},
              "commit_message": ${{ toJSON(github.event.head_commit.message) }}
            }
